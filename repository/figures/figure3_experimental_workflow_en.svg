   <g id="text_1">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(231.457813 39.83268)">Local image archive: 40,716 files</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(230.744531 51.835414)">RGB, VNIR, 800 nm and 1000 nm</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(210.402344 97.587312)">Matching by plant + day + viewing angle</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(206.88125 109.590047)">10,178 complete quartets / 40,712 images</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(216.020313 121.592781)">4 unmatched training images excluded</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(89.168438 179.360922)">TRAINING</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(44.896563 191.363656)">244 plants / 7,130 quartets</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(75.956719 203.366391)">28,520 images</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(284.317969 179.360922)">VALIDATION</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(248.957813 191.363656)">53 plants / 1,559 quartets</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(280.017969 203.366391)">6,236 images</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(502.538594 179.360922)">TEST</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(449.837813 191.363656)">50 plants / 1,489 quartets</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(480.897969 203.366391)">5,956 images</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(25.25125 259.291945)">Preprocessing and Swin adaptation</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(45.925469 271.29468)">Resize to 255 / crop to 224</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(39.036406 283.297414)">Last two blocks, CE, 5 epochs</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(30.880156 295.300148)">Then train the gated fusion head</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(264.694687 265.293312)">Checkpoint selection</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(268.051719 277.296047)">Validation accuracy</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(249.561094 289.298781)">Tie-breaker: validation loss</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(428.083125 265.293312)">Test inference with selected model</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(448.18 277.296047)">One prediction per quartet</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(457.619844 289.298781)">Four class probabilities</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(254.526563 369.243312)">Performance evaluation</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(198.935156 381.246047)">Class metrics / confusion matrix / ROC and PR</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(177.411719 393.248781)">5,000 plant-level bootstrap replicates / joint Grad-CAM</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle" x="314.1" y="436.86" transform="rotate(-0 314.1 436.86)">All days and viewing angles of a plant remain in the same data split.</text>
   </g>
  </g>
